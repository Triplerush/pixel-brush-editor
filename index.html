<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelBrush — Editor de Pixelado Selectivo</title>
  <meta name="description"
    content="Herramienta web para aplicar pixelado selectivo con pincel sobre imágenes. Exporta en máxima calidad PNG." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <!-- ─── Sidebar ─── -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="2" y="2" width="10" height="10" rx="2" fill="var(--accent)" />
          <rect x="16" y="2" width="10" height="10" rx="2" fill="var(--accent)" opacity=".6" />
          <rect x="2" y="16" width="10" height="10" rx="2" fill="var(--accent)" opacity=".6" />
          <rect x="16" y="16" width="10" height="10" rx="2" fill="var(--accent)" opacity=".3" />
        </svg>
        <h1>PixelBrush</h1>
      </div>
      <p class="subtitle">Pixelado selectivo</p>
    </div>

    <div class="sidebar-content">
      <!-- Upload -->
      <section class="control-group">
        <label class="control-label">Imagen</label>
        <button id="btn-upload" class="btn btn-primary btn-full" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          Subir imagen
        </button>
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp" hidden />
        <p id="file-name" class="file-name">Ningún archivo seleccionado</p>
      </section>

      <!-- Tool toggle -->
      <section class="control-group">
        <label class="control-label">Herramienta</label>
        <div class="tool-toggle">
          <button id="tool-brush" class="tool-btn active" type="button" title="Pincel de pixelado">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19l7-7 3 3-7 7-3-3z" />
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
              <path d="M2 2l7.586 7.586" />
              <circle cx="11" cy="11" r="2" />
            </svg>
            Pincel
          </button>
          <button id="tool-zone" class="tool-btn" type="button" title="Selección de zona">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke-dasharray="4 2" />
              <path d="M8 3v18" />
              <path d="M16 3v18" />
              <path d="M3 8h18" />
              <path d="M3 16h18" />
            </svg>
            Zona
          </button>
        </div>
      </section>

      <!-- Brush size -->
      <section id="brush-size-group" class="control-group">
        <label class="control-label" for="brush-size">
          Tamaño del pincel
          <span id="brush-size-value" class="control-value">30px</span>
        </label>
        <input type="range" id="brush-size" min="5" max="150" value="30" step="1" />
      </section>

      <!-- Pixel block size -->
      <section class="control-group">
        <label class="control-label" for="pixel-size">
          Intensidad de pixelado
          <span id="pixel-size-value" class="control-value">10px</span>
        </label>
        <input type="range" id="pixel-size" min="3" max="60" value="10" step="1" />
      </section>

      <!-- Actions -->
      <section class="control-group actions">
        <button id="btn-undo" class="btn btn-secondary btn-full" type="button" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg>
          Deshacer
        </button>
        <button id="btn-reset" class="btn btn-secondary btn-full" type="button" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
          Reiniciar
        </button>
      </section>

      <!-- Export -->
      <section class="control-group">
        <button id="btn-export" class="btn btn-accent btn-full" type="button" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Exportar PNG
        </button>
      </section>
    </div>

    <div class="sidebar-footer">
      <p>Arrastra o pega una imagen para empezar</p>
    </div>
  </aside>

  <!-- ─── Main canvas area ─── -->
  <main id="main" class="main">
    <!-- Drop zone overlay -->
    <div id="drop-overlay" class="drop-overlay hidden">
      <div class="drop-overlay-content">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <p>Suelta la imagen aquí</p>
      </div>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1"
        stroke-linecap="round" stroke-linejoin="round" opacity=".4">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <polyline points="21 15 16 10 5 21" />
      </svg>
      <h2>Sube una imagen para empezar</h2>
      <p>Arrastra una imagen aquí, pégala con <kbd>Ctrl+V</kbd>, o haz clic en <strong>Subir imagen</strong></p>
    </div>

    <!-- Canvas wrapper -->
    <div id="canvas-wrapper" class="canvas-wrapper hidden">
      <canvas id="display-canvas"></canvas>
      <!-- Brush cursor (rendered via JS) -->
      <div id="brush-cursor" class="brush-cursor"></div>
      <div id="selection-rect" class="selection-rect hidden"></div>
    </div>

    <!-- Status bar -->
    <div id="status-bar" class="status-bar hidden">
      <span id="status-dimensions"></span>
      <span id="status-zoom"></span>
      <span id="status-undo-count"></span>
    </div>
  </main>

  <script src="app.js"></script>
</body>

</html>
